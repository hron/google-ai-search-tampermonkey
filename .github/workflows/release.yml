name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build and run unit tests
        run: npm run check

      - name: Run Firefox E2E tests
        run: npm run test:firefox

      - name: Generate SHA-256 checksums
        run: |
          (cd dist && sha256sum google-ai-search-shortcuts.user.js google-ai-search-shortcuts.meta.js > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/google-ai-search-shortcuts.user.js \
            dist/google-ai-search-shortcuts.meta.js \
            dist/SHA256SUMS.txt \
            --title "$TAG_NAME" \
            --generate-notes
